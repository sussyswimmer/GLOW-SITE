<!DOCTYPE html>
<html lang="vi"
      data-title-vi="Đăng nhập | GLOW" data-title-en="Sign in | GLOW"
      data-desc-vi="Đăng nhập vào GLOW — Growing Learning Opportunities Worldwide."
      data-desc-en="Sign in to GLOW — Growing Learning Opportunities Worldwide.">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#013B36">
<title>Đăng nhập | GLOW</title>
<meta name="description" content="Đăng nhập vào GLOW — Growing Learning Opportunities Worldwide.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23014E45'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23B7EAE7'/%3E%3Ccircle cx='16' cy='16' r='7.4' fill='%2340D3BA'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%2314BA76'/%3E%3C/svg%3E">
</head>
<body class="signin">

<a class="skip-link" href="#view" data-i18n data-vi="Tới nội dung chính" data-en="Skip to main content">Tới nội dung chính</a>

<!-- The lantern glow from the marketing page, carried through so the
     public site and the platform read as one product rather than two. -->
<div class="signin-glow" aria-hidden="true"><i></i></div>

<main class="signin-wrap" id="view" tabindex="-1">
  <div class="signin-card">

    <a class="signin-logo" href="./index.html">
      <img src="./assets/img/glow-logo.png" alt="GLOW — Growing Learning Opportunities Worldwide" width="132" height="44">
    </a>

    <h1 data-i18n data-vi="Đăng nhập" data-en="Sign in">Đăng nhập</h1>
    <p class="signin-sub" data-i18n
       data-vi="Dùng tài khoản GLOW của bạn để tiếp tục học."
       data-en="Use your GLOW account to carry on learning.">Dùng tài khoản GLOW của bạn để tiếp tục học.</p>

    <!-- role=alert so a screen reader announces a failed attempt the
         moment the message appears, without moving the user. -->
    <div id="loginError" class="signin-msg" role="alert" aria-live="assertive"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username" data-i18n data-vi="Tên đăng nhập" data-en="Username">Tên đăng nhập</label>
        <input id="username" name="username" type="text"
               autocomplete="username" autocapitalize="none" autocorrect="off"
               spellcheck="false" required>
      </div>

      <div class="field">
        <label for="password" data-i18n data-vi="Mật khẩu" data-en="Password">Mật khẩu</label>
        <div class="field-pass">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>
          <button id="revealPass" class="pass-toggle" type="button"
                  aria-pressed="false" aria-label="Hiện mật khẩu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button id="loginSubmit" class="btn btn-primary btn-block" type="submit">
        <span class="btn-label" data-i18n data-vi="Đăng nhập" data-en="Sign in">Đăng nhập</span>
        <span class="btn-spin" aria-hidden="true"></span>
      </button>
    </form>

    <!-- Password reset stays in Moodle: it is the system that owns the
         account and the one that can send the mail. Linking out is honest;
         a form here that we cannot service would not be. -->
    <a class="signin-help" href="https://glow.mata9.com/login/forgot_password.php"
       target="_blank" rel="noopener noreferrer"
       data-i18n data-vi="Quên mật khẩu?" data-en="Forgotten your password?">Quên mật khẩu?</a>

    <p id="demoHint" class="signin-demo" hidden></p>

    <button id="langBtn" class="lang signin-lang" type="button" aria-pressed="false" aria-label="Language / Ngôn ngữ">
      <span class="lang-vi">VI</span><span class="lang-sep"> · </span><span class="lang-en">EN</span>
    </button>
  </div>

  <p class="signin-foot">
    <span>© 2026 Pacific Links Foundation</span>
    <a href="./index.html" data-i18n data-vi="Về trang chủ" data-en="Back to the home page">Về trang chủ</a>
  </p>
</main>

<script type="module" src="./src/login.js"></script>
</body>
</html>
